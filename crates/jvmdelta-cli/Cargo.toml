[package]
name = "jvmdelta-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI foundation for JVM performance regression analysis"

[[bin]]
name = "jvmdelta"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jvmdelta-core = { path = "../jvmdelta-core" }
